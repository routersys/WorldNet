name: macOS診断

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/diagnose-macos.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  diagnose:
    name: macOS ARM64 の参照のビルド条件を変えて比較
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: 参照データの派生を生成
        run: |
          g++ --version
          cd reference
          git clone --depth 1 https://github.com/mmorise/World.git world-src
          build() {
            name=$1
            shift
            mkdir -p "data_${name}"
            g++ "$@" -I world-src/src -I world-src/tools -I . -o "worldref_${name}" main.cpp world-src/src/*.cpp world-src/tools/audioio.cpp world-src/tools/parameterio.cpp
            "./worldref_${name}" world-src/test/vaiueo2d.wav "data_${name}" > /dev/null
            echo "=== symbols ${name}"
            nm "worldref_${name}" | grep -i "sincos" || echo "no sincos symbol"
          }
          build default -O2 -ffp-contract=off
          build nobuiltin -O2 -ffp-contract=off -fno-builtin
          build o0 -O0 -ffp-contract=off

      - name: ソリューションをビルド
        run: dotnet build WorldNet.slnx -c Release

      - name: 派生ごとに試験を実行
        run: |
          for v in default nobuiltin o0; do
            rm -rf reference/data
            cp -r "reference/data_${v}" reference/data
            for f in net8.0 net10.0; do
              echo "=== test ${v} ${f}"
              dotnet test WorldNet.Tests/WorldNet.Tests.csproj -c Release --no-build -f "${f}" 2>&1 | grep -E "^ +Failed WorldNet|Passed!|Failed!" | sed -E 's/\[[0-9]+ ms\]//' || true
            done
          done
