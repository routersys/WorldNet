name: ARM64 の時間の内訳の一時確認

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/arm-profile.yml"

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  profile:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
      - name: 原典をビルド
        run: reference/build.sh
      - name: 区間ごとの時間を測る
        run: .profkit/run.sh
