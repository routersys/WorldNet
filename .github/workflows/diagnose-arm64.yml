name: ARM64診断

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  diagnose:
    name: Windows ARM64 の参照データを派生させて比較
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: 構成を表示
        shell: pwsh
        run: |
          dotnet --info
          $env:PROCESSOR_ARCHITECTURE

      - name: 参照データの派生を生成
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          git clone --depth 1 https://github.com/mmorise/World.git reference/world-src
          Set-Location reference
          $variants = [ordered]@{
            default  = '/O2'
            strict   = '/O2 /fp:strict'
            od       = '/Od'
            contract = '/O2 /fp:contract'
          }
          foreach ($name in $variants.Keys) {
            $flags = $variants[$name]
            $bat = @"
          @echo off
          call "$vs\VC\Auxiliary\Build\vcvarsall.bat" arm64 >nul || exit /b 1
          cl 2>&1 | findstr /i "Version"
          if not exist obj_$name mkdir obj_$name
          cl /nologo $flags /EHsc /I world-src\src /I world-src\tools /I . /Fo:obj_$name\ /Fe:worldref_$name.exe main.cpp world-src\src\*.cpp world-src\tools\audioio.cpp world-src\tools\parameterio.cpp >nul || exit /b 1
          if not exist data_$name mkdir data_$name
          worldref_$name.exe world-src\test\vaiueo2d.wav data_$name >nul || exit /b 1
          "@
            Set-Content -Path "build_$name.bat" -Value $bat -Encoding ascii
            "=== build $name ($flags) ==="
            cmd /c "build_$name.bat"
          }
          exit 0

      - name: ソリューションをビルド
        run: dotnet build WorldNet.slnx -c Release

      - name: 派生ごとに試験を実行
        shell: pwsh
        run: |
          $variants = 'default', 'strict', 'od', 'contract'
          foreach ($name in $variants) {
            if (Test-Path reference\data) { Remove-Item reference\data -Recurse -Force }
            Copy-Item "reference\data_$name" reference\data -Recurse
            "=== test $name ==="
            dotnet test WorldNet.Tests\WorldNet.Tests.csproj -c Release --no-build -f net10.0 2>&1 | Select-String -Pattern "Failed |maxUlp|sample |expected|Passed!|Failed!"
          }
          "=== test default with hardware intrinsics disabled ==="
          Remove-Item reference\data -Recurse -Force
          Copy-Item reference\data_default reference\data -Recurse
          $env:DOTNET_EnableHWIntrinsic = "0"
          dotnet test WorldNet.Tests\WorldNet.Tests.csproj -c Release --no-build -f net10.0 2>&1 | Select-String -Pattern "Failed |maxUlp|sample |expected|Passed!|Failed!"
          exit 0
