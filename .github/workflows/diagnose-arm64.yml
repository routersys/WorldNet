name: ARM64診断

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/diagnose-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  diagnose:
    name: ${{ matrix.runner }} の合成の誤差を測定
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm, ubuntu-latest, ubuntu-24.04-arm]
    defaults:
      run:
        shell: bash

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: 参照データを生成 (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: reference\build.bat

      - name: 参照データを生成 (Linux)
        if: runner.os == 'Linux'
        run: reference/build.sh

      - name: 誤差を測る試験を書き出す
        run: |
          cat > WorldNet.Tests/DiagSynthesis.cs <<'EOS'
          namespace WorldNet.Tests;

          public class DiagSynthesis
          {
              [ReferenceFact]
              public void Report()
              {
                  double[] meta = ReferenceData.Load("meta").Values;
                  int fs = (int)meta[0];
                  double framePeriod = meta[2];
                  int fftSize = (int)meta[3];
                  double[] f0 = ReferenceData.Load("stonemask_f0").Values;
                  ReferenceArray spectrogram = ReferenceData.Load("cheaptrick_spectrogram");
                  ReferenceArray aperiodicity = ReferenceData.Load("d4c_aperiodicity");
                  double[] expected = ReferenceData.Load("synthesis_y").Values;
                  int yLength = Synthesis.GetSamplesForSynthesis(fs, f0.Length, framePeriod);
                  double[] y = new double[yLength];
                  using WorldArena arena = new();
                  Synthesis.Synthesize(f0, spectrogram.Values, aperiodicity.Values, fftSize, framePeriod, fs, y, arena);

                  double peak = 0;
                  double maxAbs = 0;
                  int worst = -1;
                  long mismatches = 0;
                  long maxUlp = 0;
                  int maxUlpIndex = -1;
                  for (int i = 0; i < yLength; ++i)
                  {
                      peak = Math.Max(peak, Math.Abs(expected[i]));
                      double d = Math.Abs(expected[i] - y[i]);
                      if (d > maxAbs) { maxAbs = d; worst = i; }
                      long a = BitConverter.DoubleToInt64Bits(expected[i]);
                      long b = BitConverter.DoubleToInt64Bits(y[i]);
                      if (a != b)
                      {
                          ++mismatches;
                          long u = Math.Abs(a - b);
                          if (u > maxUlp) { maxUlp = u; maxUlpIndex = i; }
                      }
                  }

                  double eps = 2.220446049250313E-16;
                  Assert.Fail($"DIAG arch={System.Runtime.InteropServices.RuntimeInformation.ProcessArchitecture} peak={peak:E6} maxAbs={maxAbs:E6} worstIndex={worst} maxAbsOverPeakOverEps={maxAbs / peak / eps:F4} mismatches={mismatches}/{yLength} maxUlp={maxUlp} atIndex={maxUlpIndex} expectedThere={expected[maxUlpIndex]:E6} actualThere={y[maxUlpIndex]:E6}");
              }
          }
          EOS
          sed -i 's/^          //' WorldNet.Tests/DiagSynthesis.cs

      - name: 誤差を測る
        run: |
          dotnet build WorldNet.Tests/WorldNet.Tests.csproj -c Release
          dotnet test WorldNet.Tests/WorldNet.Tests.csproj -c Release --no-build -f net10.0 --filter "FullyQualifiedName~DiagSynthesis" 2>&1 | grep -E "DIAG|Passed!|Failed!" || true
