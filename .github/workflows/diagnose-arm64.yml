name: ARM64診断

on:
  push:
    branches: ["develop"]
    paths:
      - ".github/workflows/diagnose-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  DOTNET_NOLOGO: "1"

jobs:
  diagnose:
    name: Windows ARM64 の参照データを派生させて比較
    runs-on: windows-11-arm
    timeout-minutes: 30

    steps:
      - name: ソースコードを取得
        uses: actions/checkout@v4

      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            10.x

      - name: 参照データを生成
        shell: cmd
        run: reference\build.bat

      - name: 二乗を Math.Pow に置き換えた版で試験
        shell: pwsh
        run: |
          foreach ($f in 'WorldNet\Synthesis.cs', 'WorldNet\WorldSynthesizer.cs') {
            $text = Get-Content $f -Raw
            $text = $text -replace 'aperiodicSpectrum\[i\] = safe \* safe;', 'aperiodicSpectrum[i] = Math.Pow(safe, DiagExponent.Two);'
            $text = $text -replace 'aperiodicSpectrum\[i\] = blended \* blended;', 'aperiodicSpectrum[i] = Math.Pow(blended, DiagExponent.Two);'
            Set-Content -Path $f -Value $text -NoNewline
          }
          git diff --stat
          Set-Content -Path WorldNet\DiagExponent.cs -Value 'namespace WorldNet; internal static class DiagExponent { public static double Two = 2.0; }'
          dotnet build WorldNet.slnx -c Release 2>&1 | Select-String -Pattern "error|Build succeeded"
          dotnet test WorldNet.Tests\WorldNet.Tests.csproj -c Release --no-build -f net10.0 2>&1 | Select-String -Pattern "Failed |maxUlp|sample |expected|Passed!|Failed!"
          exit 0
